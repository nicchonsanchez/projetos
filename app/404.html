<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Não encontrado · app.nicchon.com</title>
  <meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11141C" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="https://nicchon.com/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('app-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg:#F5F0E6; --surface:#EFE8D9; --border:#DCD2BD;
      --bordo:#5C1F1F; --bordo-soft:#4A1717;
      --fg:#1A2238; --muted:#2C3554; --dim:#6B7090;
    }
    [data-theme="dark"] {
      --bg:#11141C; --surface:#171B26; --border:#252B3B;
      --bordo:#C4604E; --bordo-soft:#A14A3A;
      --fg:#EDE7D7; --muted:#BFB8A4; --dim:#8B8775;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light; background: var(--bg); }
    html[data-theme="dark"] { color-scheme: dark; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 32rem;
      text-align: center;
    }
    .code {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: "Crimson Pro", ui-serif, Georgia, serif;
      font-weight: 500;
      font-size: clamp(3rem, 8vw, 5rem);
      letter-spacing: -0.025em;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    h1 .num { color: var(--bordo); }
    p {
      font-size: 1.0625rem;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--bordo);
      color: var(--bg);
    }
    .btn-primary:hover { background: var(--bordo-soft); transform: translateY(-1px); }
    .btn-sec {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn-sec:hover { border-color: var(--bordo); color: var(--bordo); }
    @media (max-width: 420px) {
      .btn span.label { display: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">Erro 404</p>
    <h1><span class="num">404</span></h1>
    <p>Esta página não existe (ou ainda não existe). Pode ter sido removida, renomeada, ou você digitou o caminho errado.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="label">Voltar ao app</span>
      </a>
      <a href="https://nicchon.com" class="btn btn-sec">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        <span class="label">nicchon.com</span>
      </a>
    </div>
  </main>
</body>
</html>
