<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetros · Nicchon Sanchez</title>

    <meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#11141C" media="(prefers-color-scheme: dark)">

    <meta name="author" content="Nicchon Sanchez">
    <meta name="description" content="Cronômetros regressivos com persistência local, beep e formato MM:SS. HTML+CSS+jQuery.">
    <meta property="og:title" content="Cronômetros — Nicchon Sanchez">
    <meta property="og:description" content="Cronômetros regressivos com persistência local.">

    <link rel="icon" href="https://nicchon.com/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script>
        // Anti-FOUC: aplica tema antes do render. Lê localStorage compartilhado com o agregador.
        (function () {
            try {
                var t = localStorage.getItem('app-theme');
                if (t === 'dark' || t === 'light') {
                    document.documentElement.setAttribute('data-theme', t);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>

    <script src="js/jquery-3.6.1.min.js"></script>
</head>
<body>

<header class="site-header">
    <a href="../" class="back-link" aria-label="Voltar para o app.nicchon.com">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        <span class="back-link-text">app.nicchon.com</span>
    </a>
    <button type="button" class="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg class="theme-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="theme-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
</header>

<main class="cronometros">
    <section class="hero">
        <p class="font-mono-meta">Mini-app · Estudo técnico</p>
        <h1>Cronômetros.</h1>
        <p class="lede">Múltiplos cronômetros regressivos, cada um com nome próprio. Aceita tempo em segundos (<code>300</code>) ou <code>MM:SS</code>. Beep ao terminar. Estado preservado entre recargas.</p>
    </section>

    <section class="cronometros-grupo">
        <!-- Os cronômetros são inseridos dinamicamente aqui pelo JS, antes do "+" -->
        <article class="cronometro adicionar" id="adicionarCronometro" data-acao="adicionar" role="button" tabindex="0" aria-label="Adicionar cronômetro">
            <span class="adicionar-icone">+</span>
            <span class="adicionar-label">Novo cronômetro</span>
        </article>
        <!-- /.cronometro.adicionar -->
    </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
